version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
  settings:
    errcheck:
      check-type-assertions: false
      exclude-functions:
        # JSON / fmt 書き込みはベストエフォートで無視するのが慣習
        - (encoding/json.Encoder).Encode
        - fmt.Fprintf
        - fmt.Fprintln
        - fmt.Fprint
        # UDP/TCP ソケットのクローズはエラーパス cleanup で無視するのが慣習
        - (*net.UDPConn).Close
        - (net.Conn).Close
        - (net.PacketConn).Close
        # QUIC コネクション・ストリーム・リスナーのクローズ
        - (github.com/quic-go/quic-go.Connection).CloseWithError
        - (github.com/quic-go/quic-go.EarlyConnection).CloseWithError
        - (github.com/quic-go/quic-go.Stream).Close
        - (github.com/quic-go/quic-go.SendStream).Close
        - (github.com/quic-go/quic-go.Listener).Close
        - (github.com/quic-go/quic-go.EarlyListener).Close
        # io.Closer 実装のクローズ
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*io.PipeWriter).Close
        - (*io.PipeWriter).Write
        # ファイルクローズはエラーパス cleanup で無視するのが慣習
        - (*os.File).Close
        - (mime/multipart.File).Close
        # 一時ファイル・ディレクトリの削除は cleanup でエラーを無視するのが慣習
        - os.Remove
        - os.RemoveAll
