name: Lint

on:
  push:
    branches: [master, "feat/**", "fix/**", "ci/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          only-new-issues: true
