name: Benchmark

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Run benchmarks
        run: go test -bench=. -benchmem -count=3 -timeout=300s ./... 2>&1 | tee /tmp/bench.txt

      - name: Store / compare benchmark results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          tool: go
          output-file-path: /tmp/bench.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          # Push to gh-pages only on master; PRs only get a comment.
          auto-push: ${{ github.ref == 'refs/heads/master' }}
          comment-on-alert: true
          alert-threshold: "120%"
          fail-on-alert: false
          comment-always: false
          summary-always: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: benchmarks
