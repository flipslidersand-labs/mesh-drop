name: CI

on:
  push:
    branches: [master, "feat/**", "fix/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/go-test.yml@main
    with:
      go-version: "1.25"
      runner: ubuntu-latest
      coverage-threshold: 51   # 実測 50.8%（#281/#461）。段階的に引き上げる（目標 80%）

  windows-ci:
    name: Windows build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        shell: bash
        run: go build ./...

      - name: Test
        shell: bash
        # Skip tests that rely on Unix file permissions (0600) or Unix path separators.
        run: >
          go test -short -race
          -skip 'TestConfigPath_XDG|TestDataPath_XDG|TestLoadOrCreateIdentity_FilePermissions|TestKnownPeers_appendFile_FilePermissions|TestHandleSendDir_ValidRequest_Returns200'
          ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Run integration tests
        run: go test -tags integration -timeout 120s ./internal/transfer/...
