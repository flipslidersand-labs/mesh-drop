name: CI

on:
  push:
    branches: [master, "feat/**", "fix/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/go-test.yml@main
    with:
      go-version: "1.23"
      runner: ubuntu-latest
      coverage-threshold: 50   # #540: 実カバレッジは53.4%。qa-workflows go-test.yml の閾値チェックが
                                # bc 依存で長期間サイレントに no-op していたため 60% 設定でも通っていた
                                # (mesh-drop#540 / qa-workflows 側 issue 参照)。実態に合わせて暫定 50% に。
                                # 60%→70%→80% への引き上げは実測に基づいて段階的に行う。

  windows-ci:
    name: Windows build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"

      - name: Build
        shell: bash
        run: go build ./...

      - name: Test
        shell: bash
        # Skip tests that rely on Unix file permissions (0600) or Unix path separators.
        run: >
          go test -short -race
          -skip 'TestConfigPath_XDG|TestDataPath_XDG|TestLoadOrCreateIdentity_FilePermissions|TestKnownPeers_appendFile_FilePermissions|TestHandleSendDir_ValidRequest_Returns200'
          ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.23"
      - name: Run integration tests
        run: go test -race -tags integration -timeout 180s ./internal/transfer/...

  gitleaks:
    permissions:
      contents: read
    uses: flipslidersand-labs/qa-workflows/.github/workflows/gitleaks.yml@main
