name: CI

on:
  push:
    branches: [master, "feat/**", "fix/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/go-test.yml@main
    with:
      go-version: "1.23"
      runner: ubuntu-latest
      coverage-threshold: 55   # #542: cmd/meshdrop と internal/transfer にテストを追加し
                                # 53.4%→56.6%まで引き上げ。安全マージンを見て55に設定。
                                # internal/transfer の残り未カバー領域（doSend/doReceiveFile 等の
                                # QUIC ストリーム内部処理）は defaultSession のテスト分離規約
                                # （package-level Send/Listen は共有グローバルを使うため、
                                # 非 integration タグの並列テストと安全に共存できない）により
                                # integration タグ側のテストでのみ現実的にカバー可能。
                                # 60%への到達は defaultSession のテスト容易性改善（別Issue）後に見込む。

  windows-ci:
    name: Windows build & test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        shell: bash
        run: go build ./...

      - name: Test
        shell: bash
        # Skip tests that rely on Unix file permissions (0600) or Unix path separators.
        run: >
          go test -short -race
          -skip 'TestConfigPath_XDG|TestDataPath_XDG|TestLoadOrCreateIdentity_FilePermissions|TestKnownPeers_appendFile_FilePermissions|TestHandleSendDir_ValidRequest_Returns200'
          ./...

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run integration tests
        run: go test -race -tags integration -timeout 180s ./internal/transfer/...

  gitleaks:
    permissions:
      contents: read
    uses: flipslidersand-labs/qa-workflows/.github/workflows/gitleaks.yml@main
