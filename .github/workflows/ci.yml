name: CI

on:
  push:
    branches: [master, "feat/**", "fix/**"]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    uses: flipslidersand-labs/qa-workflows/.github/workflows/go-test.yml@main
    with:
      go-version: "1.25"
      runner: ubuntu-latest
      coverage-threshold: 50   # 現状実測 50%+。段階的に引き上げる（目標 80%）
