<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeshDrop</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, sans-serif; background: #0f0f11; color: #e2e2e2; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; }
  h1 { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 0.25rem; }
  .sub { color: #888; font-size: 0.85rem; margin-bottom: 2rem; }
  .card { background: #1a1a1f; border: 1px solid #2a2a35; border-radius: 12px; padding: 1.5rem; width: 100%; max-width: 520px; margin-bottom: 1.25rem; }
  .card h2 { font-size: 0.8rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: #888; margin-bottom: 1rem; }
  #drop-zone {
    border: 2px dashed #3a3a50; border-radius: 8px; padding: 2.5rem 1rem;
    text-align: center; cursor: pointer; transition: border-color 0.15s, background 0.15s;
  }
  #drop-zone.over { border-color: #7c6cfc; background: rgba(124,108,252,0.06); }
  #drop-zone p { color: #888; font-size: 0.9rem; }
  #drop-zone strong { display: block; font-size: 1rem; color: #e2e2e2; margin-bottom: 0.5rem; }
  #file-input { display: none; }
  .peers { display: flex; flex-direction: column; gap: 0.5rem; min-height: 2rem; }
  .peer-btn {
    display: flex; align-items: center; gap: 0.75rem; padding: 0.6rem 0.9rem;
    border: 1px solid #2a2a35; border-radius: 8px; background: #13131a; cursor: pointer;
    color: #e2e2e2; font-size: 0.9rem; transition: border-color 0.15s, background 0.15s;
  }
  .peer-btn:hover { border-color: #7c6cfc; background: rgba(124,108,252,0.08); }
  .peer-btn.selected { border-color: #7c6cfc; background: rgba(124,108,252,0.15); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; flex-shrink: 0; }
  .empty { color: #555; font-size: 0.85rem; text-align: center; padding: 0.5rem 0; }
  details { margin-top: 1rem; }
  summary { cursor: pointer; font-size: 0.82rem; color: #777; user-select: none; }
  summary:hover { color: #aaa; }
  .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 0.75rem; }
  .settings-grid label { font-size: 0.8rem; color: #888; display: flex; flex-direction: column; gap: 0.3rem; }
  .settings-grid input[type=text], .settings-grid input[type=number] {
    background: #0f0f11; border: 1px solid #2a2a35; border-radius: 6px;
    color: #e2e2e2; padding: 0.35rem 0.5rem; font-size: 0.85rem;
  }
  .settings-grid input[type=checkbox] { width: 1rem; height: 1rem; accent-color: #7c6cfc; }
  .check-row { flex-direction: row !important; align-items: center; gap: 0.5rem !important; }
  .progress-wrap { margin-top: 0.75rem; display: none; }
  progress { width: 100%; height: 6px; border-radius: 3px; appearance: none; }
  progress::-webkit-progress-bar { background: #2a2a35; border-radius: 3px; }
  progress::-webkit-progress-value { background: #7c6cfc; border-radius: 3px; transition: width 0.2s; }
  .progress-label { font-size: 0.78rem; color: #888; margin-top: 0.3rem; text-align: right; }
  #send-btn {
    width: 100%; padding: 0.8rem; border: none; border-radius: 8px;
    background: #7c6cfc; color: #fff; font-size: 0.95rem; font-weight: 600;
    cursor: pointer; transition: opacity 0.15s;
  }
  #send-btn:disabled { opacity: 0.35; cursor: not-allowed; }
  #send-btn:not(:disabled):hover { opacity: 0.88; }
  .events { display: flex; flex-direction: column; gap: 0.4rem; }
  .event {
    display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.75rem;
    border-radius: 6px; font-size: 0.82rem; background: #13131a; border: 1px solid #2a2a35;
  }
  .event.ok { border-color: #166534; background: #052e16; }
  .event.err { border-color: #7f1d1d; background: #2d0a0a; }
  .event.pending { border-color: #1e3a5f; background: #0a1a2d; }
  .event .icon { font-size: 1rem; flex-shrink: 0; }
  .selected-file { margin-top: 0.75rem; font-size: 0.82rem; color: #aaa; text-align: center; }
  .mode-toggle { display: flex; gap: 0; margin-bottom: 0.75rem; border: 1px solid #2a2a35; border-radius: 8px; overflow: hidden; }
  .mode-btn { flex: 1; padding: 0.45rem; border: none; background: #13131a; color: #777; font-size: 0.82rem; cursor: pointer; transition: background 0.15s, color 0.15s; }
  .mode-btn.active { background: rgba(124,108,252,0.2); color: #c4b9fc; }
</style>
</head>
<body>
<h1>MeshDrop</h1>
<p class="sub">P2P encrypted file transfer</p>

<div class="card">
  <h2>File</h2>
  <div class="mode-toggle">
    <button id="mode-file" class="mode-btn active">File</button>
    <button id="mode-dir" class="mode-btn">Directory</button>
  </div>
  <div id="drop-zone">
    <strong id="drop-label">Drop file here</strong>
    <p>or click to browse</p>
  </div>
  <input type="file" id="file-input">
  <input type="file" id="dir-input" webkitdirectory style="display:none">
  <div class="selected-file" id="selected-name"></div>
</div>

<div class="card">
  <h2>Peer <span id="refresh-hint" style="font-weight:400;color:#555;font-size:0.75rem">(refreshing…)</span></h2>
  <div class="peers" id="peers"><div class="empty">Searching…</div></div>
</div>

<div class="card">
  <button id="send-btn" disabled>Send</button>

  <div class="progress-wrap" id="progress-wrap">
    <progress id="progress-bar" value="0" max="100"></progress>
    <div class="progress-label" id="progress-label">0%</div>
  </div>

  <details>
    <summary>Advanced settings</summary>
    <div class="settings-grid">
      <label class="check-row">
        <input type="checkbox" id="opt-compress">
        <span>Compress (zstd)</span>
      </label>
      <label>
        Level (1–9, 0=default)
        <input type="number" id="opt-level" min="0" max="9" value="0" style="width:5rem">
      </label>
      <label style="grid-column:1/-1">
        Rate limit (e.g. 10MB/s — empty = unlimited)
        <input type="text" id="opt-rate" placeholder="unlimited">
      </label>
    </div>
  </details>
</div>

<div class="card" id="log-card" style="display:none">
  <h2>Activity</h2>
  <div class="events" id="events"></div>
</div>

<script>
const dropZone  = document.getElementById('drop-zone');
const dropLabel = document.getElementById('drop-label');
const fileInput = document.getElementById('file-input');
const dirInput  = document.getElementById('dir-input');
const peersEl   = document.getElementById('peers');
const sendBtn   = document.getElementById('send-btn');
const eventsEl  = document.getElementById('events');
const logCard   = document.getElementById('log-card');
const selName   = document.getElementById('selected-name');
const progWrap  = document.getElementById('progress-wrap');
const progBar   = document.getElementById('progress-bar');
const progLabel = document.getElementById('progress-label');

let sendMode     = 'file';   // 'file' | 'dir'
let selectedFile = null;
let selectedFiles = [];      // dir mode
let selectedPaths = [];      // dir mode relative paths (parallel to selectedFiles)
let selectedPeer = null;
let activeSendId = null;

// Mode toggle
document.getElementById('mode-file').addEventListener('click', () => setMode('file'));
document.getElementById('mode-dir').addEventListener('click',  () => setMode('dir'));

function setMode(m) {
  sendMode = m;
  document.getElementById('mode-file').classList.toggle('active', m === 'file');
  document.getElementById('mode-dir').classList.toggle('active',  m === 'dir');
  dropLabel.textContent = m === 'dir' ? 'Drop folder here' : 'Drop file here';
  selectedFile = null; selectedFiles = []; selectedPaths = [];
  selName.textContent = '';
  updateBtn();
}

// Recursive directory reader for drag-and-drop
async function readEntry(entry, prefix) {
  if (entry.isFile) {
    return new Promise(resolve => entry.file(f => resolve([{ file: f, path: prefix + f.name }])));
  }
  const reader = entry.createReader();
  let all = [];
  for (;;) {
    const batch = await new Promise(resolve => reader.readEntries(resolve));
    if (!batch.length) break;
    all = all.concat(batch);
  }
  const nested = await Promise.all(all.map(e => readEntry(e, prefix + entry.name + '/')));
  return nested.flat();
}

dropZone.addEventListener('click', () => sendMode === 'dir' ? dirInput.click() : fileInput.click());
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('over'));
dropZone.addEventListener('drop', async e => {
  e.preventDefault(); dropZone.classList.remove('over');
  if (sendMode === 'dir') {
    const items = Array.from(e.dataTransfer.items || []);
    const entries = items.map(it => it.webkitGetAsEntry()).filter(Boolean);
    const results = (await Promise.all(entries.map(en => readEntry(en, '')))).flat();
    if (results.length) setDirFiles(results.map(r => r.file), results.map(r => r.path));
  } else {
    if (e.dataTransfer.files[0]) setFile(e.dataTransfer.files[0]);
  }
});
fileInput.addEventListener('change', () => { if (fileInput.files[0]) setFile(fileInput.files[0]); });
dirInput.addEventListener('change', () => {
  const files = Array.from(dirInput.files);
  if (files.length) setDirFiles(files, files.map(f => f.webkitRelativePath || f.name));
});

function setFile(f) {
  selectedFile = f;
  selName.textContent = `${f.name}  (${fmtSize(f.size)})`;
  updateBtn();
}

function setDirFiles(files, paths) {
  selectedFiles = files;
  selectedPaths = paths;
  const total = files.reduce((s, f) => s + f.size, 0);
  selName.textContent = `${files.length} file(s)  (${fmtSize(total)})`;
  updateBtn();
}

function fmtSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1<<20) return (b/1024).toFixed(1) + ' KB';
  if (b < 1<<30) return (b/(1<<20)).toFixed(1) + ' MB';
  return (b/(1<<30)).toFixed(2) + ' GB';
}

function updateBtn() {
  const hasSelection = sendMode === 'dir' ? selectedFiles.length > 0 : selectedFile != null;
  sendBtn.disabled = !(hasSelection && selectedPeer) || activeSendId != null;
}

async function loadPeers() {
  try {
    const res = await fetch('/api/peers');
    const peers = await res.json();
    document.getElementById('refresh-hint').textContent = '(auto-refresh 3s)';
    if (!peers.length) {
      peersEl.innerHTML = '<div class="empty">No peers found — is receiver running?</div>';
      selectedPeer = null; updateBtn(); return;
    }
    const prev = selectedPeer;
    peersEl.innerHTML = '';
    peers.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'peer-btn' + (prev === p.addr ? ' selected' : '');
      btn.innerHTML = `<span class="dot"></span>${p.name}<span style="color:#555;font-size:0.75rem;margin-left:auto">${p.addr}</span>`;
      btn.addEventListener('click', () => {
        document.querySelectorAll('.peer-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedPeer = p.addr;
        updateBtn();
      });
      peersEl.appendChild(btn);
      if (prev === p.addr) selectedPeer = p.addr;
    });
    updateBtn();
  } catch { document.getElementById('refresh-hint').textContent = '(error)'; }
}
loadPeers();
setInterval(loadPeers, 3000);

// SSE — progress (#238)
const sse = new EventSource('/sse/progress');
sse.onmessage = e => {
  const ev = JSON.parse(e.data);
  // Receive events arrive regardless of activeSendId
  if (ev.direction === 'recv' && ev.done) {
    addEntry(ev);
    return;
  }
  if (ev.id !== activeSendId) return;
  if (ev.done) {
    progWrap.style.display = 'none';
    activeSendId = null;
    sendBtn.textContent = 'Send';
    updateBtn();
    const pending = eventsEl.querySelector(`[data-id="${ev.id}"]`);
    if (pending) pending.remove();
    addEntry(ev);
  } else if (ev.total > 0) {
    const pct = Math.min(99, Math.round(ev.sent / ev.total * 100));
    progBar.value = pct;
    progLabel.textContent = pct + '%  —  ' + fmtSize(ev.sent) + ' / ' + fmtSize(ev.total);
  }
};

// History: load on page start (#240)
async function loadHistory() {
  try {
    const res = await fetch('/api/history');
    const entries = await res.json();
    if (entries && entries.length) {
      logCard.style.display = '';
      entries.forEach(e => addEntry({ id: e.id, direction: e.direction, file: e.file, peer: e.peer, done: true, error: e.error }));
    }
  } catch {}
}
loadHistory();

function addEntry(ev) {
  logCard.style.display = '';
  const ok = !ev.error;
  const isRecv = ev.direction === 'recv';
  const icon = ok ? (isRecv ? '⬇' : '⬆') : '✗';
  const arrow = isRecv ? '←' : '→';
  const dlLink = (ok && isRecv) ? ` <a href="/api/downloads/${ev.id}" download="${ev.file}" style="color:#7c6cfc;margin-left:0.5rem;font-size:0.8rem">Download</a>` : '';
  const div = document.createElement('div');
  div.className = 'event ' + (ok ? 'ok' : 'err');
  div.setAttribute('data-id', ev.id);
  div.innerHTML = `<span class="icon">${icon}</span>
    <span>${ev.file} <span style="color:#555">${arrow} ${ev.peer}</span>${ev.error ? ' — ' + ev.error : ''}${dlLink}</span>`;
  eventsEl.prepend(div);
}

sendBtn.addEventListener('click', async () => {
  const isDir = sendMode === 'dir';
  if ((!isDir && !selectedFile) || (isDir && !selectedFiles.length) || !selectedPeer || activeSendId != null) return;

  sendBtn.disabled = true;
  sendBtn.textContent = 'Sending…';
  progBar.value = 0;
  progLabel.textContent = '0%';
  progWrap.style.display = '';

  const form = new FormData();
  form.append('peer', selectedPeer);
  form.append('compress', document.getElementById('opt-compress').checked ? 'true' : 'false');
  form.append('compress_level', document.getElementById('opt-level').value);
  form.append('rate_limit', document.getElementById('opt-rate').value.trim());

  let displayName, endpoint;
  if (isDir) {
    selectedFiles.forEach(f => form.append('files', f));
    form.append('paths', JSON.stringify(selectedPaths));
    const total = selectedFiles.reduce((s, f) => s + f.size, 0);
    // derive directory name from first path
    const firstPath = selectedPaths[0] || '';
    const slash = firstPath.indexOf('/');
    displayName = slash > 0 ? firstPath.slice(0, slash) : firstPath || 'directory';
    endpoint = '/api/send-dir';
    // inject total as hidden meta for the progress label
    form.append('_total_hint', String(total));
  } else {
    form.append('file', selectedFile);
    displayName = selectedFile.name;
    endpoint = '/api/send';
  }

  const pendingId = 'pending-' + Date.now();
  logCard.style.display = '';
  const pendingDiv = document.createElement('div');
  pendingDiv.className = 'event pending';
  pendingDiv.setAttribute('data-id', pendingId);
  pendingDiv.innerHTML = `<span class="icon">⏳</span><span>${displayName} <span style="color:#555">→ ${selectedPeer}</span></span>`;
  eventsEl.prepend(pendingDiv);

  try {
    const res = await fetch(endpoint, { method: 'POST', body: form });
    if (!res.ok) {
      const txt = await res.text();
      progWrap.style.display = 'none';
      pendingDiv.remove();
      addEntry({ id: pendingId, direction: 'send', file: displayName, peer: selectedPeer, done: true, error: txt });
      sendBtn.textContent = 'Send';
      updateBtn();
      return;
    }
    const { id } = await res.json();
    activeSendId = id;
    pendingDiv.setAttribute('data-id', id);
  } catch (err) {
    progWrap.style.display = 'none';
    pendingDiv.remove();
    addEntry({ id: pendingId, direction: 'send', file: displayName, peer: selectedPeer, done: true, error: err.message });
    sendBtn.textContent = 'Send';
    activeSendId = null;
    updateBtn();
  }
});
</script>
</body>
</html>
